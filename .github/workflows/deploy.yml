# ---------------------------------------------------------------------------
# Deploys the dashboard container to the ECS Fargate stack that now exists in
# account 777164055831 / us-east-1 (created 2026-09-02). See infra/deploy.sh
# for what each resource is and why it is shaped that way; this workflow is the
# CI mirror of that script.
#
# STILL NOT RUNNABLE until one thing is created by hand: an IAM role that
# trusts this repo's GitHub OIDC provider. Everything else it references is
# live. Create the role, then set these repo variables under
# Settings -> Secrets and variables -> Actions -> Variables:
#
#   AWS_REGION            us-east-1
#   AWS_ACCOUNT_ID        777164055831
#   AWS_DEPLOY_ROLE_ARN   arn:aws:iam::777164055831:role/<your-oidc-deploy-role>
#   ECR_REPOSITORY        loop-dashboard
#   ECS_CLUSTER           loop-dashboard
#   ECS_SERVICE           loop-dashboard
#   CLOUDFRONT_DIST_ID    E1B8EXHI4E3CYX
#
# The deploy role needs: ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability,
# ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload,
# ecr:PutImage, ecs:RegisterTaskDefinition, ecs:UpdateService, ecs:DescribeServices,
# ecs:ListTasks, ecs:DescribeTasks, ec2:DescribeNetworkInterfaces,
# cloudfront:GetDistributionConfig, cloudfront:UpdateDistribution,
# cloudfront:CreateInvalidation, and iam:PassRole for loopDashboardTaskExecutionRole
# and loopDashboardTaskRole.
#
# No long-lived AWS access keys are used anywhere: auth is GitHub OIDC ->
# short-lived STS credentials via aws-actions/configure-aws-credentials.
# ---------------------------------------------------------------------------

name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # required for GitHub OIDC -> AWS STS
  contents: read

concurrency:
  group: deploy-to-ecs
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  CLOUDFRONT_DIST_ID: ${{ vars.CLOUDFRONT_DIST_ID }}

jobs:
  build-and-deploy:
    name: Build, push, and deploy
    # ARM runner on purpose: the task definition pins cpuArchitecture ARM64
    # (Fargate Graviton, ~20% cheaper), and cross-building linux/arm64 under
    # QEMU segfaults — Next.js 16 + Turbopack dies with "uncaught target
    # signal 11". Build natively on the target architecture instead.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/arm64 \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Register a new task definition revision
        id: taskdef
        run: |
          TD_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://infra/task-definition.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$TD_ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      # The service has no load balancer (an ALB would roughly triple the
      # monthly bill), so the task's public DNS name changes on every
      # deployment. CloudFront holds the stable HTTPS URL and has to be
      # re-pointed at the new task.
      - name: Point CloudFront at the new task
        run: ./infra/refresh-cloudfront-origin.sh

      - name: Verify the deployment actually serves traffic
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://$(aws cloudfront get-distribution --id "$CLOUDFRONT_DIST_ID" \
                --query 'Distribution.DomainName' --output text)/api/health" || true)
            if [ "$code" = "200" ]; then echo "health check OK"; exit 0; fi
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          echo "health check never returned 200" >&2
          exit 1
