# ---------------------------------------------------------------------------
# Deploys the dashboard container to the ECS Fargate stack that now exists in
# account 777164055831 / us-east-1 (created 2026-09-02). See infra/deploy.sh
# for what each resource is and why it is shaped that way; this workflow is the
# CI mirror of that script.
#
# Auth is GitHub OIDC -> short-lived STS credentials. No long-lived AWS access
# keys exist anywhere in this repo, and none should ever be added.
#
# The IAM side was created 2026-09-03 and is live:
#
#   OIDC provider  arn:aws:iam::777164055831:oidc-provider/token.actions.githubusercontent.com
#   Deploy role    arn:aws:iam::777164055831:role/loopDashboardGitHubDeployRole
#   Inline policy  loopDashboardDeployPermissions
#
# The role's trust policy is pinned to exactly one subject —
# "repo:ApagPlayz/loop-dashboard:ref:refs/heads/main" — so a workflow on a
# branch, a tag, a pull_request, or a fork cannot assume it. That is also why
# this workflow only triggers on main: a run from anywhere else will fail at
# the assume-role step by design, not by accident.
#
# The permission policy is resource-scoped rather than "ecs:*"/"ecr:*": ECR
# pushes are limited to the loop-dashboard repository, ecs:UpdateService to the
# one service ARN, CloudFront writes to distribution E1B8EXHI4E3CYX, and
# iam:PassRole to loopDashboardTaskExecutionRole + loopDashboardTaskRole with an
# iam:PassedToService=ecs-tasks.amazonaws.com condition. Only three actions are
# on "*", because AWS gives them no resource-level support:
# ecr:GetAuthorizationToken, ecs:RegisterTaskDefinition, and
# ec2:DescribeNetworkInterfaces (ecs:ListTasks is "*" too but carries an
# ecs:cluster condition).
#
# Configuration lives in repo *variables*, not secrets — none of it is
# sensitive, and a role ARN is useless without the trust policy above:
#
#   AWS_REGION            us-east-1
#   AWS_ACCOUNT_ID        777164055831
#   AWS_DEPLOY_ROLE_ARN   arn:aws:iam::777164055831:role/loopDashboardGitHubDeployRole
#   ECR_REPOSITORY        loop-dashboard
#   ECS_CLUSTER           loop-dashboard
#   ECS_SERVICE           loop-dashboard
#   CLOUDFRONT_DIST_ID    E1B8EXHI4E3CYX
#
# Application secrets (DASHBOARD_PASSWORD, SESSION_SECRET) are NOT handled here.
# They live in SSM Parameter Store as SecureStrings and are injected into the
# container by the task execution role via the "secrets" block in
# infra/task-definition.json. This workflow never reads them, so the deploy role
# deliberately has no ssm:GetParameter permission.
# ---------------------------------------------------------------------------

name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # required for GitHub OIDC -> AWS STS
  contents: read

concurrency:
  group: deploy-to-ecs
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  CLOUDFRONT_DIST_ID: ${{ vars.CLOUDFRONT_DIST_ID }}

jobs:
  build-and-deploy:
    name: Build, push, and deploy
    # ARM runner on purpose: the task definition pins cpuArchitecture ARM64
    # (Fargate Graviton, ~20% cheaper), and cross-building linux/arm64 under
    # QEMU segfaults — Next.js 16 + Turbopack dies with "uncaught target
    # signal 11". Build natively on the target architecture instead.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/arm64 \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Register a new task definition revision
        id: taskdef
        run: |
          TD_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://infra/task-definition.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$TD_ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      # The service has no load balancer (an ALB would roughly triple the
      # monthly bill), so the task's public DNS name changes on every
      # deployment. CloudFront holds the stable HTTPS URL and has to be
      # re-pointed at the new task.
      - name: Point CloudFront at the new task
        run: ./infra/refresh-cloudfront-origin.sh

      - name: Verify the deployment actually serves traffic
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://$(aws cloudfront get-distribution --id "$CLOUDFRONT_DIST_ID" \
                --query 'Distribution.DomainName' --output text)/api/health" || true)
            if [ "$code" = "200" ]; then echo "health check OK"; exit 0; fi
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          echo "health check never returned 200" >&2
          exit 1
